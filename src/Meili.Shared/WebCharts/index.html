<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasySellPut Charts</title>
<style>
/* Fallbacks match ThemePalette.Dark; chart.js replaces every token from the active app theme. */
:root{color-scheme:dark;--background:#201e1c;--text:#c9c6c1;--muted:#969188;--control:#32302c;--border:#433f3a;--accent:#c4b3d4;--error-background:#3a2a28;--error-text:#c4a46a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font:12px "Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",sans-serif;background:var(--background);color:var(--text)}
body{display:flex;flex-direction:column}
#toolbar{display:flex;gap:12px;align-items:center;padding:8px 12px;min-height:48px;border-bottom:1px solid var(--border)}
#symbol{font-size:14px;font-weight:600;flex-shrink:0}
#legend{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
button{font:inherit;font-size:14px;background:var(--control);color:var(--text);border:1px solid var(--border);border-radius:6px;min-height:32px;padding:4px 12px;cursor:pointer;flex-shrink:0}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chart{position:relative;flex:1;min-height:120px}
#empty{position:absolute;inset:45% 12px auto;text-align:center;pointer-events:none;z-index:2;color:var(--muted);font-size:14px}
footer{padding:8px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);border-top:1px solid var(--border)}
#hint{min-width:0}a{color:inherit;white-space:nowrap}a:hover{color:var(--accent)}
#error{margin:8px 12px;padding:12px 14px;border-radius:6px;background:var(--error-background);color:var(--error-text);font-size:14px;display:none}
@media(max-width:640px){#hint{display:none}footer{justify-content:flex-end}#toolbar{gap:8px}#legend{font-size:12px}}

#timeline{border-top:1px solid var(--border);padding:8px 12px;max-height:35%;overflow:auto;flex-shrink:0}
#timeline summary{cursor:pointer;font-size:14px;min-height:24px}
#event-filters{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
#event-status{color:var(--muted);margin:8px 0}
#event-content{display:flex;gap:12px;min-width:0}#event-list{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;max-height:140px;overflow:auto}
#event-list button{text-align:left;white-space:normal;flex-shrink:0}#event-detail{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-line;font-size:14px}
#event-detail p{margin:0 0 8px}#event-list button[aria-pressed=true]{border-color:var(--accent)}
@media(max-width:640px){#event-content{flex-direction:column}#timeline{max-height:40%}#event-list{max-height:80px}}
</style>
<script src="library.js" defer></script><script src="chart.js" defer></script>
</head>
<body><div id="toolbar"><span id="symbol"></span><span id="legend"></span><button id="fit" type="button">Fit</button></div><div id="error" role="alert"></div><div id="chart"><div id="empty"></div></div><details id="timeline"><summary id="event-heading">Events</summary><div id="event-filters"></div><div id="event-status" role="status"></div><div id="event-content"><div id="event-list"></div><div id="event-detail" aria-live="polite"></div></div></details><footer><span id="hint"></span><a id="attribution" href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a></footer></body>
</html>
