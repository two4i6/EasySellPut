<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasySellPut Strategy</title>
<style>
:root{color-scheme:dark;--background:#131722;--text:#d1d4dc;--muted:#a09b92;--control:#2a2e39;--border:#363a45;--accent:#90b2ff;--up:#cc8e8a;--down:#6eaa8a;--error-background:#3a2a28;--error-text:#c4a46a}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;background:var(--background);color:var(--text);font-variant-numeric:tabular-nums}body{display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit;background:var(--control);border:1px solid var(--border);border-radius:6px;min-height:32px;padding:4px 8px}button{cursor:pointer;white-space:nowrap}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,svg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;min-height:0;padding:0;vertical-align:middle}.panelhead label{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
input[type=search]{min-width:80px;width:130px}input[type=number]{width:76px}input[type=range]{width:100%;accent-color:var(--accent);padding:0;background:transparent}
#context{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}#message{margin:8px 12px 0;padding:8px 12px;border-radius:6px;background:var(--error-background);color:var(--error-text);display:none;font-size:12px}
#workspace{display:grid;grid-template-columns:minmax(340px,1.1fr) minmax(380px,1fr);gap:12px;padding:12px;flex:1;min-height:0}.panel{border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:0;min-width:0}.panelhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border)}h2{font-size:14px;font-weight:600;margin:0 auto 0 0}.caption{font-size:12px;color:var(--muted)}#chainPanel{display:flex;flex-direction:column}.scroll{overflow:auto;min-height:0;flex:1}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--border);height:40px}th{position:sticky;top:0;background:var(--control);z-index:2;font-weight:600}td:first-child,th:first-child{position:sticky;left:0;background:var(--background);z-index:1;text-align:left}th:first-child{background:var(--control);z-index:3}tr.atm td:first-child{color:var(--accent);font-weight:600}tr:hover td{background:var(--control)}td.actions,th.actions{position:sticky;right:0;background:var(--background);z-index:1;text-align:center}.actions button{font-size:14px;padding:4px 6px;margin:0 2px}.buy{color:var(--up)}.sell{color:var(--down)}#pagination{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:6px 12px}#count{margin-right:auto}
#analysis{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}.legsScroll{max-height:180px;overflow:auto}#legs select{font-size:14px}#legs td:first-child{max-width:180px;overflow:hidden;text-overflow:ellipsis}#metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 12px;border-top:1px solid var(--border)}.metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.metric strong{font-weight:600;overflow-wrap:anywhere}#curvePanel{display:flex;flex-direction:column;flex:1;min-height:220px}#payoff{width:100%;flex:1;min-height:160px;touch-action:none;cursor:crosshair}#emptyCurve{padding:20px 12px;text-align:center;color:var(--muted)}#whatif{display:flex;align-items:center;gap:12px;padding:6px 12px;font-size:12px}#whatif strong{font-size:14px}.slider{padding:0 12px}#curveLegend{font-size:12px;color:var(--muted);padding:0 12px 8px}.up{color:var(--up)}.down{color:var(--down)}#notes{padding:0 12px 8px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.empty{padding:20px 12px;text-align:center;color:var(--muted)}
@media(max-width:900px){body{overflow:auto}#workspace{grid-template-columns:1fr;flex:none;min-height:800px}#chainPanel{height:320px}#analysis{min-height:460px}.legsScroll{max-height:150px}#curvePanel{min-height:260px}}
svg[data-lucide]{vertical-align:middle;flex-shrink:0}button:has(>svg:only-child){display:inline-flex;align-items:center;justify-content:center}
/* Domain layout, composed with shared tokens and quote controls. */
#workspace{grid-template-columns:minmax(420px,1fr) minmax(320px,420px);gap:var(--space-l-g);padding:var(--space-l-g)}
#chain thead tr:first-child th{top:0;height:32px;text-align:center;background:var(--background);color:var(--muted);font-size:13px}
#chain thead tr:nth-child(2) th{top:32px;height:30px;text-align:center;font-size:12px;color:var(--muted);background:var(--background)}
#chain td{height:48px;text-align:center;border-bottom:0;padding:6px 10px}#chain td:first-child,#chain th:first-child{position:static}
#chain td.strike,#chain th.strike{position:sticky;left:42%;z-index:1;background:var(--background);font-weight:600;text-align:center;min-width:80px}
#chain th.strike{z-index:4}#chain .spot-row td{height:28px;padding:0;color:var(--text);background:var(--control);font-weight:600;border-radius:var(--control-radius)}
#chain tr.atm td.strike{color:var(--brand)}.panel{border-radius:var(--card-radius)}#analysis{gap:var(--space-l-g)}
#legs thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#legs td{height:60px;padding:10px 8px;border-bottom:0}
#legs td:first-child{max-width:150px;white-space:normal;font-weight:600;font-size:13px}#legs input{width:50px;text-align:center}#legs select{max-width:78px;border-radius:999px}
#legs td:last-child button{border-radius:999px;width:32px;min-height:32px;padding:0}.legsScroll{max-height:260px}
#metrics{grid-template-columns:1fr 1fr;padding:16px;gap:16px}.metric[data-metric=Cost]{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.metric[data-metric=Cost] strong{font-size:24px}.metric[data-metric=Cost] span{margin:0}.metric[data-metric=Profit] strong{color:var(--healthy,var(--text))}.metric[data-metric=Loss] strong{color:var(--danger)}
.metric[data-metric=Greeks],.metric[data-metric=Margin]{font-size:12px;color:var(--muted)}#curvePanel{min-height:240px}#whatif{justify-content:center}
#context{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 16px}#workbenchDetails{margin:0 16px 8px;font-size:12px;color:var(--muted)}#coverageNotice:empty{display:none}#coverageNotice{padding:4px 16px;color:var(--error-text);font-size:12px}
@media(max-width:780px){#workspace{grid-template-columns:1fr;min-height:1000px}#chainPanel{height:430px}#analysis{min-height:540px}}
@media(min-width:781px){body{overflow:hidden}#workspace{flex:1;min-height:0}#chainPanel{height:auto}#analysis{min-height:0}}
</style><script src="icons.js" defer></script><script src="motion.js" defer></script><script src="workbench.js" defer></script><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="components.css"></head>
<body><div id="context"></div><div id="message" role="status" aria-live="polite"></div><main id="workspace">
<section class="panel" id="chainPanel"><div class="panelhead"><h2 id="chainTitle"></h2><input id="search" type="search"><select id="right"><option value="All"></option><option value="Call"></option><option value="Put"></option></select><label class="caption"><input id="near" type="checkbox" checked> <span id="nearLabel"></span></label></div><div class="scroll" id="chainScroll"><table id="chain"><thead></thead><tbody></tbody></table><div id="chainEmpty" class="empty"></div></div><div id="pagination"><span id="count" class="caption"></span><button id="previous" aria-label="Previous page">‹</button><button id="next" aria-label="Next page">›</button></div></section>
<section id="analysis"><section class="panel"><div class="panelhead"><h2 id="legsTitle"></h2><span id="draft" class="caption"></span><button id="clear"></button></div><div class="legsScroll"><table id="legs"><thead></thead><tbody></tbody></table><div id="legsEmpty" class="empty"></div></div><div id="metrics"></div></section>
<section class="panel" id="curvePanel"><div class="panelhead"><h2 id="curveTitle"></h2><select id="horizon"><option value="0">T+0</option><option value="7">T+7</option><option value="14">T+14</option><option value="30">T+30</option></select><button id="fit"></button></div><svg id="payoff" tabindex="0" role="img"></svg><div id="emptyCurve"></div><div class="slider"><input id="priceSlider" type="range"></div><div id="whatif"></div><div id="curveLegend"></div></section></section>
</main><div id="coverageNotice" role="status"></div><details class="app-disclosure" id="workbenchDetails"><summary><span id="detailsLabel"></span></summary><div id="notes"></div></details></body></html>
