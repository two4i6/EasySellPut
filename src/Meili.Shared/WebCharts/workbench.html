<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasySellPut Strategy</title>
<link rel="stylesheet" href="workbench.css"><script src="icons.js" defer></script><script src="components.js" defer></script><script src="motion.js" defer></script><script src="workbench.js" defer></script><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="components.css"></head>
<body class="trading-workspace"><header id="workspaceHeader"><div class="instrument"><span id="instrumentMark" aria-hidden="true"></span><div><div class="instrument-line"><strong id="instrumentSymbol"></strong><span id="companyName"></span></div><div id="context"></div></div></div><span id="liveQuote" class="caption"></span><span id="paperBadge" class="caption"></span></header><div id="message" role="status" aria-live="polite"></div><main id="workspace">
<section id="chainArea"><div id="chainToolbar"><h2 id="chainTitle" class="sr-only"></h2><div id="right" class="app-segmented" role="tablist"><button id="rightCall" role="tab" data-right="Call"></button><button id="rightPut" role="tab" data-right="Put"></button><button id="rightAll" role="tab" data-right="All"></button></div><select id="expiration"></select><input id="search" type="search"><label class="caption near-filter"><input id="near" type="checkbox" checked><span id="nearLabel"></span></label>
<button id="centerAtm" type="button">ATM</button><details class="app-popover" data-app-popover id="columnPicker"><summary id="columnsTrigger" aria-expanded="false" aria-controls="columnPanel"><span id="columnsIcon"></span><span id="columnsLabel" class="sr-only"></span></summary><div class="app-popover-panel" id="columnPanel" role="group" aria-labelledby="columnHeading"><strong id="columnHeading"></strong><div class="app-segmented column-presets"><button id="columnsCompact"></button><button id="columnsCommon"></button><button id="columnsAll"></button></div><div id="columnOptions"></div><p id="columnsFixed" class="caption"></p></div></details>
</div><section class="panel" id="chainPanel"><div class="scroll" id="chainScroll"><table id="chain"><thead></thead><tbody></tbody></table><div id="chainEmpty" class="empty"></div></div><div id="pagination"><span id="count" class="caption"></span><button id="previous" aria-label="Previous page">‹</button><button id="next" aria-label="Next page">›</button></div></section></section>
<section id="analysis"><section class="panel ticket" id="ticketPanel"><div class="panelhead"><h2 id="legsTitle"></h2><span id="draft" class="caption"></span><button id="clear"></button></div><div id="draftEmpty"><strong id="emptyTitle"></strong><p id="emptyHint"></p><div class="empty-contracts" aria-hidden="true"><span></span><i></i><span></span><i></i></div><button id="startSelecting"></button></div><div class="legsScroll"><table id="legs"><thead></thead><tbody></tbody></table><div id="legsEmpty" class="empty"></div></div><div id="metrics"></div></section>
<section class="panel" id="curvePanel"><div class="panelhead"><h2 id="curveTitle"></h2><select id="horizon"><option value="0">T+0</option><option value="7">T+7</option><option value="14">T+14</option><option value="30">T+30</option></select><button id="fit"></button></div><svg id="payoff" tabindex="0" role="img"></svg><div id="emptyCurve"></div><div class="slider"><input id="priceSlider" type="range"></div><div id="whatif"></div><div id="curveLegend"></div></section></section>
</main><div id="coverageNotice" role="status"></div><details class="app-disclosure" id="workbenchDetails"><summary><span id="detailsLabel"></span></summary><div id="notes"></div></details></body></html>
