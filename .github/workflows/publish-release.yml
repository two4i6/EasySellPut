name: Publish verified main release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable draft version, e.g. 0.6.0 (without v)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify main, source CI, tag, signatures and every package before publishing
        run: python3 build/release/publish.py --version "$RELEASE_VERSION" --publish
