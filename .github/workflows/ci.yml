name: CLI and MCP CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_arm_runner:
        description: Apple Silicon runner (macOS Intel is always tested separately)
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_UI_LANGUAGE: en
  NUGET_PACKAGES: ${{ github.workspace }}/tools/nuget-packages

jobs:
  automation:
    name: CLI and MCP (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: "${{ inputs.macos_arm_runner || 'macos-26' }}"
            rid: osx-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the real CLI and deterministic protocol host
        run: |
          dotnet build tests/Meili.Automation.Host/Meili.Automation.Host.csproj -c Release -m:3 -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'CLI / protocol host build failed' }
      - name: Shared business and automation tests
        run: |
          $failed = $false
          foreach ($name in @('Core', 'Data', 'Analytics', 'Shared', 'Automation')) {
            dotnet test "tests/Meili.$name.Tests/Meili.$name.Tests.csproj" -c Release -m:3 --filter 'Category!=Live' --logger "trx;LogFileName=$name.trx" --results-directory build/out/ci/tests -v minimal -- RunConfiguration.TreatNoTestsAsError=true
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Shared or automation tests failed' }
      - name: Coverage guard and live-validator regression tests
        run: |
          python -m unittest discover -s tests/automation -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Capability coverage guard tests failed' }
      - name: Every operation must execute through CLI and MCP
        run: |
          python tests/automation/check_capability_coverage.py
          if ($LASTEXITCODE -ne 0) { throw 'CLI / MCP capability coverage or parity failed' }
      - name: Production CLI and stdio MCP process checks
        run: |
          python tests/automation/cli_mcp_smoke.py --dll src/Meili.Cli/bin/Release/net10.0/easysellput.dll
          if ($LASTEXITCODE -ne 0) { throw 'Production CLI / MCP process checks failed' }
      - name: Package, extract and test the native CLI and MCP distribution
        run: |
          $os = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $rid = "${{ matrix.rid }}"
          if ("$os-$arch" -ne $rid) { throw "Runner architecture mismatch: $os-$arch, expected $rid" }
          if ($IsWindows) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/pack-cli.ps1 -Runtime $rid -OutputParent build/out/ci/packages
          } else {
            bash build/pack-cli.sh $rid build/out/ci/packages
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI package build failed' }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $name = "EasySellPut-CLI-$version-$rid"
          $extension = if ($IsWindows) { '.zip' } else { '.tar.gz' }
          $archive = "build/out/ci/packages/$name$extension"
          $extract = 'build/out/ci/extracted package with spaces'
          python tests/automation/check_cli_package.py --archive $archive --rid $rid --extract-to $extract
          if ($LASTEXITCODE -ne 0) { throw 'Distribution verification failed' }
          $binary = if ($IsWindows) { 'easysellput.exe' } else { 'easysellput' }
          $executable = Join-Path (Join-Path $extract $name) $binary
          python tests/automation/cli_mcp_smoke.py --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Extracted CLI / MCP process checks failed' }
      - name: Retain installable platform packages
        uses: actions/upload-artifact@v4
        with:
          name: CLI-MCP-${{ matrix.rid }}
          path: |
            build/out/ci/packages/*.zip
            build/out/ci/packages/*.tar.gz
            build/out/ci/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-${{ matrix.rid }}
          path: |
            build/out/ci/tests/**/*.trx
            build/out/ci/capability-coverage.json
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Desktop headless regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install fonts for real Skia headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - name: Run existing desktop headless tests
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/build/ci-fonts.conf
          MEILI_RENDER_DIR: ${{ github.workspace }}/build/out/ci/render
        run: |
          mkdir -p "$MEILI_RENDER_DIR"
          dotnet test tests/Meili.Mac.Tests/Meili.Mac.Tests.csproj -c Release -m:3 --filter 'Category!=Live' --logger 'trx;LogFileName=Mac.trx' --results-directory build/out/ci/tests -v minimal -- RunConfiguration.TreatNoTestsAsError=true
      - name: Retain desktop results and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-headless
          path: |
            build/out/ci/tests/**/*.trx
            build/out/ci/render/**/*.png
          if-no-files-found: warn
          retention-days: 14

  required:
    name: CLI and MCP required
    if: always()
    needs: [automation, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: All platform and desktop checks must pass
        env:
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$AUTOMATION_RESULT" = success
          test "$DESKTOP_RESULT" = success
