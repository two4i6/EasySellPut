name: CI · Test & Package
run-name: "CI · ${{ github.head_ref || github.ref_name }} · #${{ github.run_number }}"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_arm_runner:
        description: Apple Silicon runner (macOS Intel is always tested separately)
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.macos_arm_runner || 'macos-26' }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_UI_LANGUAGE: en
  NUGET_PACKAGES: ${{ github.workspace }}/tools/nuget-packages

jobs:
  qqq-gex:
    name: QQQ GEX · Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: python3 tools/qqq-gex/verify-source.py
      - run: npm ci --no-audit --no-fund
        working-directory: web/qqq-gex
      - run: npm run build
        working-directory: web/qqq-gex
      - run: python3 tools/qqq-gex/check-surface.py
      - run: bun test upstream/src/lib/qqqGexInputQuality.test.ts upstream/src/lib/qqqExposureWire.test.ts upstream/src/lib/qqqGammaModel.test.ts upstream/src/lib/engines/analysis/QqqGexResearch.test.ts upstream/src/lib/engines/analysis/QqqIntradayDirectional.test.ts upstream/src/lib/qqqIntradayDirectionalSignals.test.ts upstream/src/lib/qqqGexCalculation.test.ts
        working-directory: web/qqq-gex
      - run: bun test upstream/src/lib/qqqIntradayDirectionalSummary.test.ts upstream/src/lib/qqqHeatmapPresentation.test.ts upstream/src/lib/qqqOptionActivityScope.test.ts upstream/src/lib/qqqIntradayIndicators.test.ts upstream/src/lib/qqqExposureSides.test.ts upstream/src/lib/qqqExposureReplay.test.ts upstream/src/lib/qqqMaxPain.test.ts upstream/src/lib/qqqIndicatorConsistency.test.ts upstream/src/lib/qqqExposureArchive.test.ts
        working-directory: web/qqq-gex
      - run: bun test upstream/src/lib/qqqIntradaySetup.test.ts upstream/src/lib/qqqChartObservationBands.test.ts upstream/src/lib/qqqHeatmapDiscovery.test.ts upstream/src/components/Strategy/qqq/qqqDirectionalChartMarkers.test.ts upstream/src/components/Strategy/qqq/qqqChartDisplayPreferences.test.ts
        working-directory: web/qqq-gex
      - run: bun test upstream/src/components/Strategy/qqq/QqqIntradayLifecycle.test.tsx upstream/src/lib/engines/analysis/QqqPcsEntrySnapshot.test.ts upstream/src/lib/engines/analysis/QqqDailyMarketBase.test.ts upstream/src/lib/engines/analysis/PcsReactiveRule.test.ts upstream/src/lib/engines/leveraged-overlay/v2/strategies/pcs-contract-profile.test.ts upstream/src/lib/engines/leveraged-overlay/v2/strategies/put-credit-spread.test.ts
        working-directory: web/qqq-gex
      - run: npx playwright install --with-deps chromium
        working-directory: web/qqq-gex
      - name: Test historical workspace and retired quote-channel isolation
        run: node tests/live-quote.mjs
        working-directory: web/qqq-gex
      - run: node tests/offline-viewer.mjs
        working-directory: web/qqq-gex
      - run: npm run build:runtime && node test-results/pcs-contract.mjs && node tests/live-display.mjs && node tests/storage-faults.mjs && node tests/wire-capacity.mjs && node tests/mcp-archive.mjs && node tests/provider-index.mjs && node tests/mcp-partial.mjs && node tests/recovery.mjs && node tests/preferences-recovery.mjs && node tests/interaction-observer.mjs && node tests/ui-observation-portability.mjs && npm run test:pipeline && node tests/mcp-analysis-fixture.mjs && node test-results/mcp-kernel-parity.mjs && node tests/pulse-replay-cohort.mjs && node test-results/wall-view-parity.mjs && node test-results/spread-study-parity.mjs && node test-results/chart-positive-parity.mjs && node test-results/chart-real-parity.mjs
        working-directory: web/qqq-gex
      - run: QQQ_TEST_DB="$(node -p "JSON.parse(require('fs').readFileSync('test-results/pipeline-location.json')).dbPath")" QQQ_TEST_DECISION=test-results/pcs-positive.json node tests/offline-viewer.mjs
        working-directory: web/qqq-gex
      - run: bun tests/wire-benchmark.ts
        working-directory: web/qqq-gex
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test private GEX session recovery and repeated rendering
        run: |
          dotnet build tests/Meili.Qqq.CloudHost/Meili.Qqq.CloudHost.csproj -m:3 -v minimal
          python3 build/bundle-qqq-runtime.py linux-x64 tests/Meili.Qqq.CloudHost/bin/Debug/net10.0
          cd web/qqq-gex
          node tests/session-soak.mjs
      - name: Test shared app engine SDK
        run: node --test web/app-sdk/engine.test.mjs web/app-sdk/client.test.mjs web/app-sdk/engine-host.test.mjs web/app-sdk/presentation.test.mjs
      - name: Build & verify independent app fixture
        run: |
          mkdir -p build/out/app-fixture
          trap 'rm -f "$RUNNER_TEMP/app-fixture-key.pem"' EXIT
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/app-fixture-key.pem"
          openssl pkey -in "$RUNNER_TEMP/app-fixture-key.pem" -pubout -out "$RUNNER_TEMP/app-fixture-public.pem"
          python3 build/pack-app.py --repository "$GITHUB_REPOSITORY" --key "$RUNNER_TEMP/app-fixture-key.pem" --ui-dir web/qqq-gex/dist --output build/out/app-fixture/qqq-gex-test.espapp
          python3 tests/automation/app_package_smoke.py --archive build/out/app-fixture/qqq-gex-test.espapp --public-key "$RUNNER_TEMP/app-fixture-public.pem" --repository "$GITHUB_REPOSITORY"
          python3 tests/automation/app_release_smoke.py --archive build/out/app-fixture/qqq-gex-test.espapp --key "$RUNNER_TEMP/app-fixture-key.pem" --public-key "$RUNNER_TEMP/app-fixture-public.pem" --repository "$GITHUB_REPOSITORY"
          rm "$RUNNER_TEMP/app-fixture-key.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: QQQ-GEX-test-package
          path: build/out/app-fixture/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qqq-gex-web-evidence
          path: web/qqq-gex/test-results
  cli:
    name: ${{ matrix.label }} · CLI/MCP
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            label: Linux x64
          - os: windows-latest
            rid: win-x64
            label: Windows x64
          - os: windows-11-arm
            rid: win-arm64
            label: Windows ARM64
          - os: macos-15-intel
            rid: osx-x64
            label: Mac Intel
          - os: "${{ inputs.macos_arm_runner || 'macos-26' }}"
            rid: osx-arm64
            label: Mac Apple Silicon
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python guard dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Install app build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare app compatibility seed
        run: python build/prepare-app-seed.py --if-current
      - name: Build CLI & protocol test host
        run: |
          dotnet build tests/Meili.Automation.Host/Meili.Automation.Host.csproj -c Release -m:3 -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'CLI / protocol host build failed' }
      - name: Verify compiled update repository and key
        run: |
          python tests/automation/check_update_source.py dotnet src/Meili.Cli/bin/Release/net10.0/easysellput.dll
          if ($LASTEXITCODE -ne 0) { throw 'Compiled updater trust binding failed' }
      - name: Test upstream, fork and development update binding
        if: runner.os == 'Linux'
        run: |
          python tests/automation/update_source_build_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Update repository build binding failed' }
      - name: Test shared business logic
        run: |
          $failed = $false
          foreach ($name in @('Core', 'Data', 'Analytics', 'Shared', 'Automation')) {
            dotnet test "tests/Meili.$name.Tests/Meili.$name.Tests.csproj" -c Release -m:3 --filter 'Category!=Live' --logger "trx;LogFileName=$name.trx" --results-directory build/out/ci/tests -v minimal -- RunConfiguration.TreatNoTestsAsError=true
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Shared or automation tests failed' }
      - name: Test coverage & validation guards
        run: |
          python -m unittest discover -s tests/automation -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Capability coverage guard tests failed' }
      - name: Verify CLI/MCP capability parity
        run: |
          python tests/automation/check_capability_coverage.py
          if ($LASTEXITCODE -ne 0) { throw 'CLI / MCP capability coverage or parity failed' }
      - name: Test CLI/MCP processes
        run: |
          python tests/automation/cli_mcp_smoke.py --dll src/Meili.Cli/bin/Release/net10.0/easysellput.dll
          if ($LASTEXITCODE -ne 0) { throw 'Production CLI / MCP process checks failed' }
      - name: Test cache maintenance & data preservation
        run: |
          python tests/automation/cache_management_smoke.py --dll src/Meili.Cli/bin/Release/net10.0/easysellput.dll
          if ($LASTEXITCODE -ne 0) { throw 'Cache maintenance or protected data checks failed' }
          python tests/automation/gex_compaction_recovery.py --dll src/Meili.Cli/bin/Release/net10.0/easysellput.dll
          if ($LASTEXITCODE -ne 0) { throw 'Interrupted GEX compaction recovery failed' }
      - name: Build isolated app development host
        run: |
          dotnet build tools/Meili.AppDev/Meili.AppDev.csproj -c Release -m:3 -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'App development host build failed' }
      - name: Test isolated app development host
        run: |
          python build/pack-app.py --development --repository test/source --output "$env:RUNNER_TEMP/dev-app.espapp"
          if ($LASTEXITCODE -ne 0) { throw 'Development app package failed' }
          python tests/automation/app_dev_smoke.py --archive "$env:RUNNER_TEMP/dev-app.espapp" --public-key "$env:RUNNER_TEMP/dev-app.espapp.public.pem"
          if ($LASTEXITCODE -ne 0) { throw 'App development isolation regression failed' }
      - name: Test app updates through CLI & MCP
        run: |
          python tests/automation/app_mcp_update_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent app MCP update regression failed' }
      - name: Test cross-process app maintenance
        run: |
          python tests/automation/app_maintenance_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'App execution lease or data preservation failed' }
      - name: Test host without app toolchain
        if: runner.os == 'Linux'
        run: |
          python tests/automation/host_without_app_build_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Host build still depends on the app toolchain' }
      - name: Build & test CLI package
        # The Linux check proves ordinary host compilation does not invoke the app toolchain.
        # Packaging below explicitly prepares its compatibility seed.
        run: |
          $os = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $rid = "${{ matrix.rid }}"
          if ("$os-$arch" -ne $rid) { throw "Runner architecture mismatch: $os-$arch, expected $rid" }
          if ($IsWindows) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/pack-cli.ps1 -Runtime $rid -OutputParent build/out/ci/packages
          } else {
            bash build/pack-cli.sh $rid build/out/ci/packages
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI package build failed' }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $name = "EasySellPut-CLI-$version-$rid"
          $extension = if ($IsWindows) { '.zip' } else { '.tar.gz' }
          $archive = "build/out/ci/packages/$name$extension"
          $extract = 'build/out/ci/extracted package with spaces'
          python tests/automation/check_cli_package.py --archive $archive --rid $rid --extract-to $extract
          if ($LASTEXITCODE -ne 0) { throw 'Distribution verification failed' }
          $binary = if ($IsWindows) { 'easysellput.exe' } else { 'easysellput' }
          $executable = Join-Path (Join-Path $extract $name) $binary
          python tests/automation/cli_mcp_smoke.py --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Extracted CLI / MCP process checks failed' }
          python tests/automation/qqq_runtime_smoke.py --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Bundled GEX runtime checks failed' }
          python tests/automation/cache_management_smoke.py --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Extracted cache maintenance checks failed' }
      - name: Upload CLI package
        uses: actions/upload-artifact@v4
        with:
          name: CLI-MCP-${{ matrix.rid }}
          path: |
            build/out/ci/packages/*.zip
            build/out/ci/packages/*.tar.gz
            build/out/ci/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-${{ matrix.rid }}
          path: |
            build/out/ci/tests/**/*.trx
            build/out/ci/capability-coverage.json
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI · Layout & Charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install UI test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - name: Install app build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare app compatibility seed
        run: python3 build/prepare-app-seed.py --if-current
      - name: Test layout, themes & update reminders
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/build/ci-fonts.conf
          MEILI_RENDER_DIR: ${{ github.workspace }}/build/out/ci/render
          MEILI_THEME_PROFILE: ${{ github.workspace }}/build/out/ci/render/theme-performance.json
        run: |
          mkdir -p "$MEILI_RENDER_DIR"
          dotnet test tests/Meili.Mac.Tests/Meili.Mac.Tests.csproj -c Release -m:3 --blame-crash --blame-crash-dump-type mini --filter 'Category!=Live' --logger 'trx;LogFileName=Mac.trx' --results-directory build/out/ci/tests -v minimal -- RunConfiguration.TreatNoTestsAsError=true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build chart test host
        run: dotnet build tests/Meili.Workbench.Host/Meili.Workbench.Host.csproj -c Release -m:3 -v minimal
      - name: Test chart interactions
        env:
          MEILI_RENDER_DIR: ${{ github.workspace }}/build/out/ci/render
        run: |
          python tests/webcharts/test_renderer.py -v
          python tests/webcharts/test_workbench.py -v
          python tests/webcharts/test_timeline.py -v
          python tests/webcharts/test_sessions.py -v
          python tests/webcharts/test_drawings.py -v
      - name: Upload UI screenshots & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-headless
          path: |
            build/out/ci/tests/**/*.trx
            build/out/ci/tests/**/*_Sequence.xml
            build/out/ci/tests/**/*.dmp
            build/out/ci/render/**/*.png
            build/out/ci/render/**/*.json
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: ${{ matrix.label }} · Desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            label: Windows x64
          - os: windows-11-arm
            rid: win-arm64
            label: Windows ARM64
          - os: macos-15-intel
            rid: osx-x64
            label: Mac Intel
          - os: "${{ inputs.macos_arm_runner || 'macos-26' }}"
            rid: osx-arm64
            label: Mac Apple Silicon
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Set Full HD capture desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/ci-display.ps1
      - name: Install WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $runtime = $roots | ForEach-Object { Get-ChildItem "$_/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue }
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
            $process = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - name: Install app build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare app compatibility seed
        run: python build/prepare-app-seed.py --if-current
      - name: Test native WebView
        shell: pwsh
        run: |
          dotnet build tests/Meili.NewsBrowser.Smoke/Meili.NewsBrowser.Smoke.csproj -c Release -p:BuildInParallel=false
          if ($LASTEXITCODE -ne 0) { throw 'Native browser host build failed' }
          $os = if ($IsWindows) { 'win' } else { 'osx' }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $tfm = if ($IsWindows) { 'net10.0-windows10.0.19041.0' } else { 'net10.0' }
          python build/bundle-qqq-runtime.py "$os-$arch" "tests/Meili.NewsBrowser.Smoke/bin/Release/$tfm"
          if ($LASTEXITCODE -ne 0) { throw 'Native browser pinned runtime bundle failed' }
          dotnet run --no-build --project tests/Meili.NewsBrowser.Smoke/Meili.NewsBrowser.Smoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Native news/GEX browser smoke failed' }

      - name: Test Windows desktop & update reminders
        if: runner.os == 'Windows'
        env:
          MEILI_RENDER_DIR: ${{ github.workspace }}/build/out/ci/desktop-render
        shell: pwsh
        run: |
          dotnet test tests/Meili.App.Tests/Meili.App.Tests.csproj -c Release -m:3 --filter 'Category!=Live' --logger 'trx;LogFileName=Windows.trx' --results-directory build/out/ci/tests -- RunConfiguration.TreatNoTestsAsError=true
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop regression failed' }


      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build desktop package
        shell: pwsh
        run: |
          python -m pip install pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Icon tooling installation failed' }
          $os = if ($IsWindows) { 'win' } else { 'osx' }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          python build/pack-desktop.py --rid "$os-$arch" --output build/out/ci/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging failed' }
      - name: Check native GEX inspection pixels
        shell: pwsh
        run: |
          python tests/webcharts/check_gex_native_pixels.py build/out/ci
          if ($LASTEXITCODE -ne 0) { throw 'Native GEX inspection pixel check failed' }
      - name: Test packaged app & updater
        shell: pwsh
        run: |
          $os = if ($IsWindows) { 'win' } else { 'osx' }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $archive = (Get-ChildItem build/out/ci/desktop/*.zip | Select-Object -First 1).FullName
          python tests/automation/check_desktop_package.py --archive $archive --rid "$os-$arch" --extract-to 'build/out/ci/desktop extracted with spaces'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted desktop verification failed' }
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.os }}
          path: |
            build/out/ci/desktop/*.zip
            build/out/ci/desktop/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-package-evidence-${{ matrix.os }}
          path: |
            build/out/ci/desktop-smoke*
            build/out/ci/theme-switch-*.png
            build/out/ci/desktop-render/**/*.png
            build/out/ci/desktop-render/**/*.json
            build/out/ci/tests/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  release-policy:
    name: Release · main guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test main-only release rules
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 build/release/check-workflows.py
          python3 -m unittest discover -s tests/automation -p 'test_release_policy.py' -v

  required:
    name: CI · Required checks
    if: always()
    needs: [cli, ui, desktop, release-policy, qqq-gex]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to pass
        env:
          CLI_RESULT: ${{ needs.cli.result }}
          UI_RESULT: ${{ needs.ui.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          RELEASE_POLICY_RESULT: ${{ needs.release-policy.result }}
          QQQ_GEX_RESULT: ${{ needs.qqq-gex.result }}
        run: |
          test "$CLI_RESULT" = success
          test "$UI_RESULT" = success
          test "$DESKTOP_RESULT" = success
          test "$RELEASE_POLICY_RESULT" = success
          test "$QQQ_GEX_RESULT" = success
