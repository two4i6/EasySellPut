name: Apps · Release
run-name: "Apps · ${{ inputs.action || 'prepare draft' }} QQQ GEX ${{ inputs.version || 'current version' }} · ${{ github.ref_name }}"
on:
  workflow_run:
    workflows: ['CI · Test & Package']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a signed draft or explicitly publish it
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      version:
        description: Optional app version (empty uses web/qqq-gex/app.json)
        type: string
        required: false
      ci_run_id:
        description: Optional current-main CI run (auto-detected when empty)
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: official-app-release
  cancel-in-progress: false
jobs:
  release:
    name: Verify & release app
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.APPS_AUTO_PREPARE == 'true'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_INPUT: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
      APP_VERSION_INPUT: ${{ inputs.version }}
      APP_ACTION: ${{ inputs.action || 'prepare' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve version and verify current main CI
        id: source
        run: python3 build/release/app-source.py --output "$RUNNER_TEMP/app-release-source.json"
      - name: Download tested app artifact
        if: steps.source.outputs.action == 'prepare' && steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: QQQ-GEX-test-package
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tested-app
      - name: Sign tested app and prepare draft
        if: steps.source.outputs.action == 'prepare' && steps.source.outputs.skip != 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python3 build/release/app-release.py prepare --run-id "$RUN_ID" --version "$APP_VERSION" --artifact "$RUNNER_TEMP/tested-app/qqq-gex-test.espapp"
      - name: Verify draft and explicitly publish app catalog
        if: github.event_name == 'workflow_dispatch' && steps.source.outputs.action == 'publish'
        run: python3 build/release/app-release.py publish --run-id "$RUN_ID" --version "$APP_VERSION"
